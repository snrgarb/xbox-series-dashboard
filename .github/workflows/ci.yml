# CI: every pull request and every push to main, on GitHub's own runners (ubuntu-24.04). The repository is public, so
# they cost nothing, and a pull request from a fork runs on GitHub's machine, never on one of the owner's. Nothing is
# kept between runs but the caches: Cargo's registry and target/ (Swatinem/rust-cache, one cache per job) and the
# llvm-mingw toolchain (by its version).
#   Test      formatting, clippy and the tests, on Linux (cargo-nextest: many at once). Tests that need a frame drawn
#             draw it offscreen through lavapipe. The screenshot tests, which compare a frame with a reference picture,
#             are #[ignore]d and run by hand only; SHOTS=forbid fails any that is not (crates/shots). What the screens
#             look like is checked on the TV PC.
#   Windows   the release build for x86_64-pc-windows-gnullvm, cross-compiled with llvm-mingw as on the development
#             box, uploaded as an artifact for the end-to-end tests to take.
#   Package   only on a version tag (v0.1.0) or when run by hand (workflow_dispatch): that build packed as the portable
#             zip and the per-user installer (tools/package.sh: NSIS and cargo-about, on this same Linux runner),
#             uploaded as a workflow artifact. Nothing is published: no release is made here, ever (docs/release.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The runner
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, $(nproc) cores, $(free -g | awk '/Mem:/ {print $2}') GB memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - name: lavapipe and the tests' fonts
        run: |
          need=""
          for p in build-essential pkg-config mesa-vulkan-drivers libvulkan1 fonts-dejavu-core; do dpkg -s "$p" >/dev/null 2>&1 || need="$need $p"; done
          if [ -n "$need" ]; then sudo -n apt-get update && sudo -n apt-get install -y --no-install-recommends $need; fi
          tools/test-fonts.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: cargo-nextest
        env:
          NEXTEST: 0.9.100
        run: |
          if ! cargo nextest --version 2>/dev/null | grep -q "$NEXTEST"; then
            curl -fsSL "https://get.nexte.st/$NEXTEST/linux" | tar -xzf - -C "$HOME/.cargo/bin"
          fi
          cargo nextest --version
      - name: Test
        run: |
          SHOTS=forbid cargo nextest run --workspace --profile ci --cargo-profile ci
          cargo test --workspace --doc --profile ci

  windows:
    name: Windows
    runs-on: ubuntu-24.04
    env:
      LLVM_MINGW: llvm-mingw-20261104-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_SHA256: 919380403de87dca3c581c2053230cd298af5e891286628ba0613b7fed370926
    steps:
      - uses: actions/checkout@v4
      - name: The runner
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, $(nproc) cores, $(free -g | awk '/Mem:/ {print $2}') GB memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnullvm
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: llvm-mingw, cached by its version
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw/${{ env.LLVM_MINGW }}
          key: ${{ env.LLVM_MINGW }}
      - name: llvm-mingw, fetched where the cache had none
        run: |
          if [ ! -x "$HOME/llvm-mingw/$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" ]; then
            curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/$LLVM_MINGW.tar.xz"
            echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | sha256sum -c
            mkdir -p "$HOME/llvm-mingw/$LLVM_MINGW"
            tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$HOME/llvm-mingw/$LLVM_MINGW" --strip-components=1
          fi
      - name: Put it on the path
        run: |
          echo "$HOME/llvm-mingw/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CC_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "AR_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-llvm-ar" >> "$GITHUB_ENV"
      - name: Clippy, for the code only Windows compiles
        run: |
          rustup component add clippy
          cargo clippy --workspace --all-targets --target x86_64-pc-windows-gnullvm
      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnullvm
      # Discord messages (#197, docs/discord-web.md) and the Discord spike (#196) load WebView2Loader.dll from beside
      # their exe: Microsoft's redistributable loader, as webview2-com-sys ships it, copied from that crate's build next
      # to the exes. Never committed; tools/package.sh ships it beside dashboard.exe.
      - name: WebView2Loader.dll beside dashboard.exe
        run: |
          release=target/x86_64-pc-windows-gnullvm/release
          loader="$(find "$release/build" -path '*webview2-com-sys*/out/x64/WebView2Loader.dll' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$loader" || { echo "no WebView2Loader.dll in webview2-com-sys's build" >&2; exit 1; }
          cp "$loader" "$release/"
      # The build is the check; a full artifact store (the quota is recalculated only every 6 to 12 hours) is not a
      # failure of the code.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows
          path: |
            target/x86_64-pc-windows-gnullvm/release/*.exe
            target/x86_64-pc-windows-gnullvm/release/WebView2Loader.dll
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package
    needs: [test, windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      CARGO_ABOUT_VERSION: 0.9.3
      CARGO_ABOUT_SHA256: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
      # Code signing (docs/release.md): a PFX certificate, base64, and its password. Not set, as now: the package is
      # unsigned and the Signing step is skipped.
      SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
      SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: The runner
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, $(nproc) cores, $(free -g | awk '/Mem:/ {print $2}') GB memory, $(df -h --output=avail . | tail -1 | tr -d ' ') free"
      - name: Rust, for cargo-about's look at the dependencies
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: The tag names the workspace's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(awk '/^\[workspace\.package\]/ { s = 1; next } /^\[/ { s = 0 } s && $1 == "version" { gsub(/"/, "", $3); print $3 }' Cargo.toml)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "the tag $GITHUB_REF_NAME is not v$version, the workspace's version" >&2; exit 1; }
      - name: NSIS, the distribution's own package
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis
          makensis -VERSION
      - name: cargo-about
        run: |
          if ! cargo-about --version 2>/dev/null | grep -q "$CARGO_ABOUT_VERSION"; then
            archive="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
            curl -fsSL -o "$RUNNER_TEMP/$archive.tar.gz" "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$archive.tar.gz"
            echo "$CARGO_ABOUT_SHA256  $RUNNER_TEMP/$archive.tar.gz" | sha256sum -c
            tar -xzf "$RUNNER_TEMP/$archive.tar.gz" -C "$RUNNER_TEMP"
            install -m 755 "$RUNNER_TEMP/$archive/cargo-about" "$HOME/.cargo/bin/cargo-about"
          fi
          cargo-about --version
      - name: The Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: target/ci-windows
      # Where signing plugs in. With the secrets set, a command that signs a file in place (osslsigncode: Authenticode,
      # SHA-256, timestamped), which tools/package.sh runs on dashboard.exe, the installer and its uninstaller.
      - name: Signing
        if: env.SIGNING_CERT != ''
        run: |
          command -v osslsigncode >/dev/null || sudo -n apt-get install -y --no-install-recommends osslsigncode
          umask 077
          echo "$SIGNING_CERT" | base64 -d > "$RUNNER_TEMP/signing.pfx"
          printf '%s' "$SIGNING_PASSWORD" > "$RUNNER_TEMP/signing.pass"
          {
            echo '#!/bin/sh'
            echo 'set -e'
            echo "osslsigncode sign -pkcs12 '$RUNNER_TEMP/signing.pfx' -readpass '$RUNNER_TEMP/signing.pass' -n 'Xbox Series Dashboard' -h sha256 -t http://timestamp.digicert.com -in \"\$1\" -out \"\$1.signed\""
            echo 'mv "$1.signed" "$1"'
          } > "$RUNNER_TEMP/sign.sh"
          chmod 700 "$RUNNER_TEMP/sign.sh"
          echo "SIGN_COMMAND=$RUNNER_TEMP/sign.sh" >> "$GITHUB_ENV"
      - name: Package
        id: package
        run: |
          rm -rf target/package
          tools/package.sh target/ci-windows/dashboard.exe target/package
          echo "name=$(cd target/package && ls *-setup.exe | sed 's/-setup\.exe$//')" >> "$GITHUB_OUTPUT"
      - name: Forget the certificate
        if: always() && env.SIGNING_CERT != ''
        run: rm -f "$RUNNER_TEMP/signing.pfx" "$RUNNER_TEMP/signing.pass" "$RUNNER_TEMP/sign.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            target/package/*-portable.zip
            target/package/*-setup.exe
            target/package/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
