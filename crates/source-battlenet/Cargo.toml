[package]
name = "source-battlenet"
version.workspace = true
publish.workspace = true
edition = "2021"

[dependencies]
log-line = { path = "../log-line" }
model = { path = "../model" }
source-kit = { path = "../source-kit" }
anyhow = "1"
serde_json = "1"
# The fake's spec, kept beside it for the stand-in Agent (`fixture`).
serde = { version = "1", features = ["derive"] }
# The Agent's local HTTP API (`agent`, #172): plain HTTP to 127.0.0.1.
ureq = { version = "3.5", default-features = false }

# Which program runs and listens on which port: the Agent's (`listening`); the Agent the Dashboard started tied to
# its process (`agent`); Windows' own language, for the Agent's form.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
