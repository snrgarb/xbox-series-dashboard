[package]
name = "source-xbox"
version.workspace = true
publish.workspace = true
license.workspace = true
edition = "2021"
description = "Xbox and Microsoft Store PC games: the packages registered for the user that carry a MicrosoftGame.config."

[dependencies]
log-line = { path = "../log-line" }
model = { path = "../model" }
source-kit = { path = "../source-kit" }
anyhow = "1"
# The Store queue's answers (store_queue.ps1 writes JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
# The package family name of a package the package manager has not registered: the fake's.
sha2 = "0.10"
# For the fixture's generated logos only.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
# The package manager is WinRT, which windows-sys leaves out. wgpu's DX12 backend already builds this crate.
windows = { version = "0.62", features = ["ApplicationModel", "Management_Deployment", "Foundation_Collections"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
