[package]
name = "source-steam"
version.workspace = true
publish.workspace = true
license.workspace = true
edition = "2021"

[dependencies]
log-line = { path = "../log-line" }
model = { path = "../model" }
anyhow = "1"
serde_json = "1"
# Steam's own calls and their answers, as JSON (`client`).
serde = { version = "1", features = ["derive"] }
# A licence agreement's page, read for the Dashboard's own prompt (`eula`, #230).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# For the fixture's generated art only.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# How far a download has got, live (`live`), and what `probe` reads for `--log-queue-sources`; Steam's main window
# (`client`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Threading",
    # Steam's main window, how it stood before an install brought it up (`client`).
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
