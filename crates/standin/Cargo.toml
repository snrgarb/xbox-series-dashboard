[package]
name = "standin"
version = "0.0.0"
edition = "2021"
description = "Test support: a fake Steam install, a stand-in Steam and a stand-in game, for the end-to-end tests."

[dependencies]
source-steam = { path = "../source-steam" }
model = { path = "../model" }
audio = { path = "../audio" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
