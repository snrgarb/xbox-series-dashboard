[package]
name = "standin"
version.workspace = true
publish.workspace = true
license.workspace = true
edition = "2021"
description = "Test support: fake stores (Steam, EA, Ubisoft, Battle.net), stand-ins for their clients and a stand-in game, for the end-to-end tests."

[dependencies]
source-steam = { path = "../source-steam" }
source-epic = { path = "../source-epic" }
source-gog = { path = "../source-gog" }
source-ea = { path = "../source-ea" }
source-ubisoft = { path = "../source-ubisoft" }
source-battlenet = { path = "../source-battlenet" }
source-xbox = { path = "../source-xbox" }
model = { path = "../model" }
# serve-art: the stand-in SteamGridDB, and the plain pictures it serves.
library = { path = "../library" }
image = { version = "0.25", default-features = false, features = ["png"] }
audio = { path = "../audio" }
# serve-updates: the stand-in update address, and the release it serves.
update = { path = "../update" }
# serve-helpers: the stand-in helpers' release pages, and the table that points at them.
helpers = { path = "../helpers" }
# The stand-in launchers' installers (#178): the registry file standing in for Windows' list of installed programs.
source-kit = { path = "../source-kit" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# media: a media session of its own, through a window's System Media Transport Controls (WinRT).
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
