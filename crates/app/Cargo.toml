[package]
name = "app"
version = "0.0.0"
edition = "2021"
description = "The executable."

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
library = { path = "../library" }
source-steam = { path = "../source-steam" }
render = { path = "../render" }
ui = { path = "../ui" }
screens = { path = "../screens" }
input = { path = "../input" }
shell = { path = "../shell" }
wgpu = "30"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
