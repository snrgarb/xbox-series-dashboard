[package]
name = "app"
version = "0.0.0"
edition = "2021"
description = "The executable."

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
source-steam = { path = "../source-steam" }
render = { path = "../render" }
screens = { path = "../screens" }
input = { path = "../input" }
shell = { path = "../shell" }
wgpu = "30"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"

[dev-dependencies]
shots = { path = "../shots" }
