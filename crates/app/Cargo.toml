[package]
name = "app"
version = "0.0.0"
edition = "2021"
description = "The executable."

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
model = { path = "../model" }
library = { path = "../library" }
source-steam = { path = "../source-steam" }
source-epic = { path = "../source-epic" }
source-gog = { path = "../source-gog" }
source-ea = { path = "../source-ea" }
source-ubisoft = { path = "../source-ubisoft" }
source-battlenet = { path = "../source-battlenet" }
source-xbox = { path = "../source-xbox" }
render = { path = "../render" }
ui = { path = "../ui" }
screens = { path = "../screens" }
input = { path = "../input" }
shell = { path = "../shell" }
audio = { path = "../audio" }
media = { path = "../media" }
discord = { path = "../discord" }
shell-mode = { path = "../shell-mode" }
wgpu = "30"
winit = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
anyhow = "1"
# Waits for the error scope round the surface's configuration (window.rs).
pollster = "1"

[dev-dependencies]
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
