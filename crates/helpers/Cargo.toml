[package]
name = "helpers"
version.workspace = true
publish.workspace = true
license.workspace = true
edition = "2021"
description = "The helper programs some stores install through (legendary, gogdl; docs/spec/helpers.md): one table of each's fixed version, address and SHA-256, fetched on the user's Yes into the data folder, checked, and removed. Never bundled or linked into the Dashboard."

[dependencies]
model = { path = "../model" }
# The launchers' apps (`clients`): Windows' list of installed programs, or a test's file standing in for it.
source-kit = { path = "../source-kit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A small blocking HTTP client, TLS by rustls, no async runtime (as update's).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
