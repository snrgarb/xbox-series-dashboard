[package]
name = "shell"
version.workspace = true
publish.workspace = true
edition = "2021"
description = "Windows itself: the Overlay window, launching and tracking games, z-order and the foreground."

[dependencies]
log-line = { path = "../log-line" }
model = { path = "../model" }
# Steam's CEF console and which of its folders a program is in (`steam`).
source-steam = { path = "../source-steam" }
# The helper programs' runner (`helper`), which the stores that install through one share.
source-kit = { path = "../source-kit" }
render = { path = "../render" }
wgpu = "30"
log = "0.4"

[target.'cfg(windows)'.dependencies]
model = { path = "../model" }
pollster = "1"
# DirectComposition is COM, which windows-sys leaves out. wgpu's DX12 backend already builds this crate.
# Core Audio is COM too: the Audio Flyout's devices, volume and mute.
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
anyhow = "1"
