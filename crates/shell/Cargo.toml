[package]
name = "shell"
version = "0.0.0"
edition = "2021"
description = "Windows itself: the Overlay window, launching and tracking games, z-order and the foreground."

[dependencies]
model = { path = "../model" }
render = { path = "../render" }
wgpu = "30"
log = "0.4"

[target.'cfg(windows)'.dependencies]
pollster = "1"
# DirectComposition is COM, which windows-sys leaves out. wgpu's DX12 backend already builds this crate.
# Core Audio is COM too: the Audio Flyout's devices, volume and mute.
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
