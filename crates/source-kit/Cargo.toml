[package]
name = "source-kit"
version = "0.0.0"
edition = "2021"
description = "What the store sources share: the registry or a file standing in for it, protobuf, command lines."

[dependencies]
model = { path = "../model" }
anyhow = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
