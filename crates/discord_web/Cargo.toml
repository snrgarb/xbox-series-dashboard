[package]
name = "discord_web"
version.workspace = true
publish.workspace = true
edition = "2021"
description = "Discord's web session (#197): discord.com in a WebView2 on a thread of its own, one session per Profile in the data folder, signed in by the user on Discord's own page."

[dependencies]
log-line = { path = "../log-line" }
model = { path = "../model" }

[target.'cfg(windows)'.dependencies]
serde_json = "1"
# MIT; the WebView2 COM bindings Tauri's wry uses, on windows 0.62 as the workspace is. WebView2Loader.dll is loaded
# at run time from beside dashboard.exe (docs/discord-web.md, "The loader"), so the Dashboard starts, and says no
# runtime, where it is missing.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
