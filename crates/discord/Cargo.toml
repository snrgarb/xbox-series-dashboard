[package]
name = "discord"
version.workspace = true
publish.workspace = true
edition = "2021"
description = "Discord's local RPC: the user's own application, the connection, its tokens, and a fake Discord for tests."

[dependencies]
log-line = { path = "../log-line" }
model = { path = "../model" }
serde_json = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
# The fake's stand-in CDN: plain pictures for avatars.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
