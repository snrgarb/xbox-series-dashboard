[package]
name = "input"
version.workspace = true
publish.workspace = true
edition = "2021"
description = "The gamepad, through XInput, and the Guide button."

[dependencies]
log-line = { path = "../log-line" }
ui = { path = "../ui" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }
