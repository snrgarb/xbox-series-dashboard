[package]
name = "shell-mode"
version = "0.0.0"
edition = "2021"
description = "Shell mode: the Dashboard in place of the Windows desktop at sign-in. Turning it on and off, and the --shell process that does the Boot shell's job (docs/spec/shell-mode.md)."

[dependencies]
model = { path = "../model" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
# The --shell process reads the pad itself while no Dashboard runs: the Guide button and View+Menu held.
input = { path = "../input" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# Windows' default audio device, which the --shell process waits on before starting the Dashboard: Core Audio is COM.
windows = { version = "0.62", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
