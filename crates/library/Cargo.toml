[package]
name = "library"
version = "0.0.0"
edition = "2021"
description = "The library database: every source's games in one SQLite file, with what the user did with them."

[dependencies]
model = { path = "../model" }
anyhow = "1"
# Play history is told by the calendar where the user is.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# A filter's rule is kept as JSON.
serde_json = "1"
# SQLite built from the source rusqlite carries: nothing to install on Windows, and the same one everywhere.
rusqlite = { version = "0.42", features = ["bundled"] }
# Art from SteamGridDB (docs/sources.md, "Art"): a small blocking HTTP client, TLS by rustls, no async runtime.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
source-steam = { path = "../source-steam" }
tempfile = "3"
