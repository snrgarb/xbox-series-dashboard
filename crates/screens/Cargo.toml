[package]
name = "screens"
version = "0.0.0"
edition = "2021"
description = "The Dashboard's screens, and the core that holds them: no window, no Windows."

[dependencies]
model = { path = "../model" }
ui = { path = "../ui" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[dev-dependencies]
render = { path = "../render" }
shots = { path = "../shots" }
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = "30"
