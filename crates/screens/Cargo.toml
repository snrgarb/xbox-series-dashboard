[package]
name = "screens"
version = "0.0.0"
edition = "2021"
description = "The Dashboard's screens."

[dependencies]
model = { path = "../model" }
render = { path = "../render" }
wgpu = "30"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
