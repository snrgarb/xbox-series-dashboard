[package]
name = "overlay-spike"
version.workspace = true
publish.workspace = true
license.workspace = true
edition = "2021"
description = "Spike for issue #2: a transparent, topmost Overlay window drawn by wgpu. Throwaway."

[[bin]]
name = "overlay-spike"
path = "src/main.rs"

[dependencies]
render = { path = "../../crates/render" }
wgpu = "30"

[target.'cfg(windows)'.dependencies]
log = "0.4"
# DirectComposition is COM, which windows-sys leaves out. wgpu's DX12 backend already builds this crate.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
